name: Spelling Sprint v2.0.9 one-time check

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test spelling-sprint/main.test.cjs
      - run: git diff --check HEAD^ HEAD
